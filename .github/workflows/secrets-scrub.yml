name: secrets-scrub
on:
  workflow_dispatch:
    inputs:
      pattern_file:
        description: 'File with one regex per line. Default: secrets.txt'
        required: false
        default: 'secrets.txt'
      dry_run:
        description: 'If true, only list commits where secrets appear; do not rewrite history.'
        required: false
        default: 'true'
      force_push:
        description: 'If true, force-push after rewrite. Otherwise abort before push.'
        required: false
        default: 'false'

concurrency:
  group: secrets-scrub
  cancel-in-progress: false

jobs:
  scan:
    name: Scan history for known secret patterns
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Build BFG replacement file
        run: |
          set -euo pipefail
          cp "${{ github.event.inputs.pattern_file }}" /tmp/patterns.txt
          test -s /tmp/patterns.txt
          wc -l /tmp/patterns.txt
      - name: Scan commits for offending files (dry run)
        if: ${{ github.event.inputs.dry_run == 'true' }}
        run: |
          set -euo pipefail
          echo "Scanning all commits for the patterns (this may take a minute)..."
          # Build a single regex alternation
          PATTERN=$(awk '{printf "%s|", $0}' /tmp/patterns.txt | sed 's/|/$/' | sed 's/\//\\//g')
          # Look for pattern in commit diffs (history). This is heuristic but
          # catches the common case where secrets were committed in .env or
          # a JSON file. Print up to 50 commits that match.
          git log --all --pretty=format:'%H %s' -z \
            | xargs -0 -n1 -I{} bash -c 'set -- $1; git show -p --pretty=format: $1 2>/dev/null | grep -lE "'"$PATTERN"'" >/dev/null && echo "$1 $2"' _ {}
          echo "Scan complete. Review the commit list above."
      - name: Apply BFG repo cleaner
        if: ${{ github.event.inputs.dry_run == 'false' }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq && sudo apt-get install -yqq bfg 2>/dev/null || {
            echo "BFG not in apt — falling back to git-filter-repo"
            pip install --quiet git-filter-repo
            python -m git_filter_repo --replace-text /tmp/patterns.txt --force
          }
          # BFG needs a fresh clone; clone again into a scratch dir.
          cd /tmp
          git clone --no-hardlinks "$GITHUB_WORKSPACE" scrub
          cd scrub
          bfg --replace-text /tmp/patterns.txt --no-blob-protection --force
          git reflog expire --expire=now --all
          git gc --prune=now --aggressive
          # Push back via fast-forward — caller is responsible for force_push.
          if [ "${{ github.event.inputs.force_push }}" = 'true' ]; then
            git push --force --tags origin 'HEAD:refs/heads/main'
          else
            echo "Refusing to push. Rerun with force_push=true after inspecting /tmp/scrub."
            exit 1
          fi